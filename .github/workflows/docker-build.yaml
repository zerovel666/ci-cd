name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t fastapi-app:${{ github.sha }} .
      
      - name: Test Docker image
        run: docker run --rm fastapi-app:${{ github.sha }} python -m pytest || true